plugins {
    id 'com.android.application'
}

android {
    namespace 'com.stb.markettrader'
    compileSdk 34

    defaultConfig {
        applicationId "com.stb.markettrader"
        minSdk 17
        targetSdk 19
        versionCode 8
        versionName "1.5.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
